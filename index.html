<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="learn_bible.ico" type="image/x-icon" />
  <style>
    :root {
      --bg: #111;
      --fg: #e8e8e8;
      --muted: #b3b3b3;
      --card: #1a1a1a;
      --accent: #4da3ff;
      --border: #2a2a2a;
      --danger: #ff5a5a;
      --ok: #3ccf7a;
      --control-bg: #151515;
      --control-fg: #e8e8e8;
      --focus: 0 0 0 3px rgba(77, 163, 255, 0.35);
    }

    .theme-light {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --muted: #555;
      --card: #f5f5f7;
      --accent: #1f6feb;
      --border: #e5e5ea;
      --danger: #d7263d;
      --ok: #228b22;
      --control-bg: #fff;
      --control-fg: #1d1d1f;
      --focus: 0 0 0 3px rgba(31, 111, 235, 0.25);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      line-height: 1.4;
    }

    /* Container 1 Columna */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Container 2 Columnas */
    .container2c {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 1px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Card rows */
    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }

    .row-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 10px 0;
    }

    .phrases {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .phrase-line {
      display: grid;
      grid-template-columns: 30px 1fr 28px;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--control-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .lang-tag {
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      user-select: none;
    }

    .phrase-text {
      font-size: clamp(14px, var(--phrase-font, 26px), 100px);
      white-space: normal;
      word-wrap: break-word;
    }

    .replay-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }

    .replay-btn:focus {
      outline: none;
      box-shadow: var(--focus);
    }

    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    /* Inline compact controls */
    .inline-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .inline-controls .spacer {
      flex: 1;
    }

    select,
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="file"] {
      background: var(--control-bg);
      color: var(--control-fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
      box-sizing: border-box;
      max-width: 100%;
    }

    /* Combo boxes compact width, adapt to content */
    select {
      width: auto;
      max-width: 100%;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }

    button:focus {
      outline: none;
      box-shadow: var(--focus);
    }

    /* Panels inside rows */
    .panel {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }

    .panel-title {
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(4, minmax(60px, auto));
      gap: 8px 14px;
      align-items: center;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .font-slider {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="range"] {
      width: 45%;
    }

    .tiny-toggle {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      color: var(--muted);
    }

    .textarea {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      min-height: 160px;
      max-height: 380px;
      background: var(--control-bg);
      color: var(--control-fg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }

    .progress-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    progress {
      width: 220px;
      height: 14px;
      accent-color: var(--accent);
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--danger);
    }

    /* Mobile-first spacing and tap targets */
    .inline-controls>* {
      min-height: 0px;
    }

    .checks input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }

    /* Responsive layout */
    @media (min-width: 900px) {
      .container {
        gap: 14px;
        padding: 16px;
      }
    }

    @media (max-width: 600px) {
      .checks {
        grid-template-columns: 1fr;
      }

      .phrases {
        gap: 8px;
      }

      .phrase-line {
        grid-template-columns: 28px 1fr 28px;
      }

      .inline-controls .spacer {
        display: none;
      }

    }
  </style>
</head>

<body class="theme-dark">
  <div class="container">

    <!-- Row 1: Current phrases display -->
    <section class="row" id="row-phrases">
      <div class="phrases" id="phrasesView">
        <!-- Language slot 1 -->
        <div class="phrase-line" data-pos="1">
          <div class="lang-tag" id="lang-tag-1">ES</div>
          <div class="phrase-text" id="text-1"></div>
          <button class="replay-btn" id="replay-1" title="Replay 1" aria-label="Replay 1">▶</button>
        </div>
        <!-- Language slot 2 -->
        <div class="phrase-line" data-pos="2">
          <div class="lang-tag" id="lang-tag-2">EN</div>
          <div class="phrase-text" id="text-2"></div>
          <button class="replay-btn" id="replay-2" title="Replay 2" aria-label="Replay 2">▶</button>
        </div>
        <!-- Only ES and EN supported (IT/PT removed) -->
      </div>
    </section>

    <!-- Row 2: Operation Modes -->
    <section class="row" id="row-modes">
      <div class="inline-controls">
        <label class="badge">
          <span>Mode</span>
          <select id="modeSelect" aria-label="Mode">
            <option>Manual Mode</option>
            <option>Auto Mode</option>
            <option>Speaking Practice Mode</option>
            <option>Writing Practice Mode</option>
          </select>
        </label>
        <button id="btnRandom" class="secondary" title="Show a random phrase">Random Phrase</button>
        <div class="spacer"></div>
        <div id="modeContent" style="width:100%"></div>
      </div>
    </section>

  </div>


  <div class="container">
    <!-- Row 2.5: Languages -->
    <section class="row" id="row-languages">
      <div class="panel">
        <div class="panel-title">Languages</div>
        <div class="inline-controls">
          <label class="badge"><span>Language 1</span>
            <select id="lang1Select">
              <option value="es" selected>Spanish</option>
              <option value="en">English</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="de">German</option>
              <option value="fr">French</option>
            </select>
          </label>
          <label class="badge"><span>Language 2</span>
            <select id="lang2Select">
              <option value="es">Spanish</option>
              <option value="en" selected>English</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="de">German</option>
              <option value="fr">French</option>
            </select>
          </label>
          <div class="spacer"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="container2c">
    <!-- Row 3: Language Reading Checkboxes -->
    <section class="row" id="row-read">
      <div class="panel">
        <div class="panel-title">Read Language</div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="read-1" checked /> <span id="read-label-1">L1</span></label>
          <label class="check"><input type="checkbox" id="read-2" /> <span id="read-label-2">L2</span></label>
        </div>
      </div>
    </section>

    <!-- Row 3 (continued): Language Display Options -->
    <section class="row" id="row-show">
      <div class="panel">
        <div class="panel-title">Show Language</div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="show-1" checked /> <span id="show-label-1">L1</span></label>
          <label class="check"><input type="checkbox" id="show-2" /> <span id="show-label-2">L2</span></label>
        </div>
      </div>
    </section>
  </div>

  <div class="container">
    <!-- Font Size -->
    <section class="row" id="row-show">
      <div class="font-slider" style="margin-top:10px">
        <span class="badge">Font size</span>
        <input type="range" min="14" max="100" value="26" id="fontRange" />
        <span id="fontValue" class="status">26 px</span>
        <span class="spacer"></span>
        <label class="tiny-toggle">
          <input type="checkbox" id="themeToggle" checked />
          <span>Dark theme</span>
        </label>
      </div>
    </section>

    <!-- Row 4: Phrase list (CSV textbox) -->
    <section class="row" id="row-csv">
      <div class="panel">
        <div class="panel-title">Phrases (CSV: ES,EN)</div>
        <div class="inline-controls">
          <div style="width:100%">
            <textarea class="textarea" id="csvBox" style="width:100%; min-height:2.4em; resize:vertical"></textarea>
            
          </div>
        </div>
      </div>
    </section>



    <!-- Row 7: OpenAI loader -->
    <section class="row" id="row-ai">
      <div class="panel">
        <div class="panel-title">Load phrases from OpenAI</div>
        <div class="inline-controls">
          <label class="badge" style="display:block; width:100%"><span>Topic</span></label>
          <div style="width:100%">
            <textarea  class="textarea"  id="aiTopic" placeholder="e.g., comida, viajes"
              style="width:100%; min-height:2.4em; resize:vertical"></textarea>
          </div>
          <label class="badge"><span>Level</span>
            <select id="aiLevel">
              <option value="ANY" selected>Any</option>
              <option value="A1">A1</option>
              <option value="A2">A2</option>
              <option value="B1">B1</option>
              <option value="B2">B2</option>
              <option value="C1">C1</option>
              <option value="C2">C2</option>
            </select>
          </label>
          <label class="badge"><span>Quantity</span>
            <input type="number" id="aiQuantity" min="1" max="500" value="40" style="width:7ch" />
          </label>
          <label class="badge"><span>Min words</span>
            <input type="number" id="aiMinWords" min="1" max="500" value="15" style="width:7ch" />
          </label>
          <label class="badge"><span>OPEN_AI_TOKEN</span>
            <input type="password" id="openaiToken" placeholder="sk-..." style="width:50px" />
          </label>
          <div class="spacer"></div>
          <button id="btnLoadAI">Load from AI</button>
          <span id="aiStatus" class="status">Idle</span>
        </div>
      </div>
    </section>

    <!-- Row 5: Phrases Loading Options -->
    <section class="row" id="row-load">
      <div class="inline-controls">
        <label class="badge">
          <span>Predefined sets</span>
          <select id="predefinedSelect">
            <option value="">(Select a set)</option>
          </select>
        </label>
        <button id="btnLoadPredefined" class="secondary">Load selected</button>
        <div class="spacer"></div>
        <label class="badge">
          <span>Load from file</span>
          <input type="file" id="fileInput" accept=".csv,.txt" />
        </label>
      </div>
    </section>

    <!-- Row 6: Speech Synthesis configurations -->
    <section class="row" id="row-tts">
      <div class="inline-controls" style="gap:10px; flex-wrap:wrap">
        <label class="badge"><span>Voice 1</span>
          <select id="voice-1"></select>
        </label>
        <label class="badge"><span>Voice 2</span>
          <select id="voice-2"></select>
        </label>
        <label class="badge"><span>Rate</span>
          <input type="number" id="rate" min="0.5" max="2" step="0.1" value="1.0" style="width:80px" />
        </label>
        <label class="badge"><span>Pitch</span>
          <input type="number" id="pitch" min="0" max="2" step="0.1" value="1.0" style="width:80px" />
        </label>
      </div>
    </section>
  </div>

  <script>
    (() => {
      // --- State ---
      const els = {
        text: {
          1: document.getElementById('text-1'),
          2: document.getElementById('text-2'),
        },
        replay: {
          1: document.getElementById('replay-1'),
          2: document.getElementById('replay-2'),
        },
        read: {
          1: document.getElementById('read-1'),
          2: document.getElementById('read-2'),
        },
        show: {
          1: document.getElementById('show-1'),
          2: document.getElementById('show-2'),
        },
        modeSelect: document.getElementById('modeSelect'),
        btnRandom: document.getElementById('btnRandom'),
        modeContent: document.getElementById('modeContent'),
        csvBox: document.getElementById('csvBox'),
        predefinedSelect: document.getElementById('predefinedSelect'),
        btnLoadPredefined: document.getElementById('btnLoadPredefined'),
        fileInput: document.getElementById('fileInput'),
        fontRange: document.getElementById('fontRange'),
        fontValue: document.getElementById('fontValue'),
        themeToggle: document.getElementById('themeToggle'),
        voices: {
          1: document.getElementById('voice-1'),
          2: document.getElementById('voice-2'),
        },
        lang1Select: document.getElementById('lang1Select'),
        lang2Select: document.getElementById('lang2Select'),
        langTag: {
          1: document.getElementById('lang-tag-1'),
          2: document.getElementById('lang-tag-2'),
        },
        readLabel: { 1: document.getElementById('read-label-1'), 2: document.getElementById('read-label-2') },
        showLabel: { 1: document.getElementById('show-label-1'), 2: document.getElementById('show-label-2') },
        openaiToken: document.getElementById('openaiToken'),
        aiLevel: document.getElementById('aiLevel'),
        aiTopic: document.getElementById('aiTopic'),
        aiQuantity: document.getElementById('aiQuantity'),
        aiMinWords: document.getElementById('aiMinWords'),
        btnLoadAI: document.getElementById('btnLoadAI'),
        aiStatus: document.getElementById('aiStatus'),
        rate: document.getElementById('rate'),
        pitch: document.getElementById('pitch'),
      };

      const langMeta = {
        es: { localeGuess: ['es-ES', 'es-419', 'es-MX', 'es-AR', 'es-PE'], label: 'ES' },
        en: { localeGuess: ['en-US', 'en-GB', 'en-AU'], label: 'EN' },
        it: { localeGuess: ['it-IT'], label: 'IT' },
        pt: { localeGuess: ['pt-BR', 'pt-PT'], label: 'PT' },
        de: { localeGuess: ['de-DE', 'de-AT', 'de-CH'], label: 'DE' },
        fr: { localeGuess: ['fr-FR', 'fr-CA', 'fr-BE', 'fr-CH'], label: 'FR' },
      };
      //fr: { localeGuess: ['fr-FR','fr-CA','fr-BE','fr-CH'], label: 'FR' },
      //de: { localeGuess: ['de-DE','de-AT','de-CH'], label: 'DE' }


      let parsedRows = [];               // Array of objects keyed by selected language codes
      let currentIndex = -1;             // Index in parsedRows
      let phraseSessionId = 0;           // Monotonic token
      let autoTimer = null;              // Auto mode interval
      let speakingPractice = {
        active: false,
        rec: null,
        lang: 'es',
        min: 90,
        liveTextEl: null,
        scoreEl: null,
        progressEl: null,
        statusEl: null,
      };
      let writingPractice = {
        active: false,
        lang: 'es',
        inputEl: null,
        statusEl: null,
        writingBusy: false,
        currentWriteTarget: '',
      };
      let savedConfig = null;

      // --- Utilities ---
      function normalizeForCompare(s) {
        return (s || '')
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip diacritics
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')               // remove punctuation
          .replace(/\s+/g, ' ')                            // collapse spaces
          .trim();
      }

      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        if (m === 0) return n;
        if (n === 0) return m;
        const v0 = new Array(n + 1);
        const v1 = new Array(n + 1);
        for (let i = 0; i <= n; i++) v0[i] = i;
        for (let i = 0; i < m; i++) {
          v1[0] = i + 1;
          const ai = a.charCodeAt(i);
          for (let j = 0; j < n; j++) {
            const cost = ai === b.charCodeAt(j) ? 0 : 1;
            v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
          }
          for (let j = 0; j <= n; j++) v0[j] = v1[j];
        }
        return v0[n];
      }

      function similarityPercent(a, b) {
        const A = normalizeForCompare(a);
        const B = normalizeForCompare(b);
        if (!A && !B) return 100;
        const dist = levenshtein(A, B);
        const base = Math.max(A.length, B.length);
        const pct = Math.max(0, Math.round((1 - dist / base) * 100));
        return pct;
      }

      function getSelectedLangCodes() {
        return [els.lang1Select.value, els.lang2Select.value];
      }

      function updateLangLabels() {
        const [l1, l2] = getSelectedLangCodes();
        els.langTag[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.langTag[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
        els.readLabel[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.readLabel[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
        els.showLabel[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.showLabel[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
      }

      function parseCSV(text) {
        const [l1, l2] = getSelectedLangCodes();
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        const rows = [];
        for (const line of lines) {
          const cols = parseCSVLine(line);
          if (cols.length >= 2) {
            const obj = {};
            obj[l1] = cols[0];
            obj[l2] = cols[1];
            rows.push(obj);
          }
        }
        return rows;
      }

      // Basic CSV line parser supporting double-quoted fields and escaped quotes "".
      function parseCSVLine(line) {
        const out = [];
        let cur = '';
        let inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQ) {
            if (ch === '"') {
              if (i + 1 < line.length && line[i + 1] === '"') {
                cur += '"'; i++;
              } else {
                inQ = false;
              }
            } else {
              cur += ch;
            }
          } else {
            if (ch === ';') {
              out.push(cur); cur = '';
            } else if (ch === '"') {
              inQ = true;
            } else {
              cur += ch;
            }
          }
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      function pickRandomIndex(len) {
        return len > 0 ? Math.floor(Math.random() * len) : -1;
      }

      function applyShowVisibility() {
        // Show/hide by slot (1/2)
        for (const pos of [1, 2]) {
          const show = !!els.show[pos].checked;
          const el = document.querySelector(`.phrase-line[data-pos="${pos}"]`);
          if (el) el.style.display = show ? 'grid' : 'none';
        }
      }

      function setPhraseTexts(row) {
        const [l1, l2] = getSelectedLangCodes();
        els.text[1].textContent = row?.[l1] || '';
        els.text[2].textContent = row?.[l2] || '';
      }

      function getReadOrder() {
        return [1, 2]; // read slot order
      }

      function getVoicesMap() {
        const map = {};
        const [l1, l2] = getSelectedLangCodes();
        map[l1] = (els.voices[1].options[els.voices[1].selectedIndex]?.value) || els.voices[1].value || '';
        map[l2] = (els.voices[2].options[els.voices[2].selectedIndex]?.value) || els.voices[2].value || '';
        return map;
      }

      // Find a matching SpeechSynthesisVoice given a desired selection (name) or language
      function findVoiceForLang(voices, desiredName, k) {
        if (desiredName) {
          // Exact name match
          let v = voices.find(vv => vv.name === desiredName || vv.voiceURI === desiredName);
          if (v) return v;
          // Case-insensitive contains match
          v = voices.find(vv => (vv.name || '').toLowerCase().includes(desiredName.toLowerCase()));
          if (v) return v;
        }
        // Fallback: prefer voices whose lang matches our guesses
        const guessList = langMeta[k]?.localeGuess || [k];
        let v = voices.find(vv => vv.lang && guessList.some(gl => vv.lang.startsWith(gl)));
        if (v) return v;
        // Last resort: match by language prefix (es, en, it, pt)
        v = voices.find(vv => vv.lang && vv.lang.startsWith(k));
        return v || null;
      }

      function getRatePitch() {
        return {
          rate: Math.max(0.5, Math.min(2, parseFloat(els.rate.value || '1') || 1)),
          pitch: Math.max(0, Math.min(2, parseFloat(els.pitch.value || '1') || 1)),
        };
      }

      // --- Local Storage: save / load UI configuration ---

          if (typeof cfg.themeDark !== 'undefined') { els.themeToggle.checked = !!cfg.themeDark; document.body.classList.toggle('theme-light', !els.themeToggle.checked); document.body.classList.toggle('theme-dark', els.themeToggle.checked); }
          if (cfg.mode) els.modeSelect.value = cfg.mode;

      // --- Speech Synthesis: robust sequence with session token and timeouts ---
      async function speakCurrentRowSequence(sessionToken, row) {
        // Gather settings per slot
        const readSlots = { 1: !!els.read[1].checked, 2: !!els.read[2].checked };
        const any = readSlots[1] || readSlots[2];
        if (!any) return; // resolve immediately

        // Wait for voices to be ready (up to 1000ms)
        await new Promise(res => {
          const start = performance.now();
          const done = () => res();
          const tryNow = () => {
            if (speechSynthesis.getVoices().length > 0 || performance.now() - start > 1000) {
              done();
            } else {
              setTimeout(tryNow, 100);
            }
          };
          if ('onvoiceschanged' in speechSynthesis) {
            let fired = false;
            const handler = () => { if (!fired) { fired = true; speechSynthesis.onvoiceschanged = null; done(); } };
            speechSynthesis.onvoiceschanged = handler;
            setTimeout(() => { if (!fired) { speechSynthesis.onvoiceschanged = null; done(); } }, 1000);
          } else {
            tryNow();
          }
        });

        // Cancel anything pending, then enqueue sequence
        try { speechSynthesis.cancel(); } catch { }

        const voices = speechSynthesis.getVoices();
        const voiceIds = getVoicesMap();
        const { rate, pitch } = getRatePitch();
        const order = getReadOrder().filter(pos => readSlots[pos]);

        let totalChars = 0;
        const utters = [];
        const [l1, l2] = getSelectedLangCodes();
        const slotToLang = { 1: l1, 2: l2 };
        for (const pos of order) {
          const k = slotToLang[pos];
          const text = (row && row[k]) ? String(row[k]) : '';
          totalChars += text.length;
          const u = new SpeechSynthesisUtterance(text);
          const v = findVoiceForLang(voices, voiceIds[k], k);
          if (v) u.voice = v;
          u.lang = (v && v.lang) ? v.lang : (langMeta[k]?.localeGuess?.[0] || 'en-US');
          u.rate = rate;
          u.pitch = pitch;
          utters.push({ pos, k, u });
        }

        let endedCount = 0;
        let resolved = false;

        const finishResolve = () => {
          if (resolved) return;
          resolved = true;
          // no return (Promise resolved by outer async)
        };

        const hardTimeoutMs = Math.max(12000, 12000 + Math.ceil(totalChars / 100) * 2000);
        const hardTimer = setTimeout(() => {
          if (document.hidden) {
            try { speechSynthesis.cancel(); } catch { }
            finishResolve();
          } else {
            try { speechSynthesis.cancel(); } catch { }
            finishResolve();
          }
        }, hardTimeoutMs);

        // Poll speaking becomes false for >=300ms before resolve
        let lastSpeakingFalse = null;
        const poll = setInterval(() => {
          if (resolved) { clearInterval(poll); return; }
          if (!speechSynthesis.speaking) {
            if (lastSpeakingFalse == null) lastSpeakingFalse = performance.now();
            if (performance.now() - lastSpeakingFalse >= 300) {
              clearInterval(poll);
              clearTimeout(hardTimer);
              finishResolve();
            }
          } else {
            lastSpeakingFalse = null;
          }
        }, 100);

        await new Promise(resolve => {
          // Attach handlers and speak sequentially (enqueue lets them play in order)
          for (const { u } of utters) {
            u.onend = () => {
              if (resolved) return;
              if (sessionToken !== phraseSessionId) return;
              endedCount++;
              if (endedCount === utters.length) {
                // Let poll/300ms rule finalize; if nothing fires, poll will resolve
              }
            };
            u.onerror = () => {
              if (resolved) return;
              if (sessionToken !== phraseSessionId) return;
              endedCount++;
              // keep going; if all error/end, poll/timeout will settle
            };
            speechSynthesis.speak(u);
          }
          // The resolution is managed by polling + hard timeout; to "await" until resolve:
          const watcher = setInterval(() => {
            if (resolved) {
              clearInterval(watcher);
              clearInterval(poll);
              clearTimeout(hardTimer);
              resolve();
            }
          }, 50);
        });
      }

      // Single-language replay (row scope only)
      function replaySlot(pos) {
        if (currentIndex < 0 || !parsedRows[currentIndex]) return;
        const sessionToken = ++phraseSessionId;
        try { speechSynthesis.cancel(); } catch { }
        const row = parsedRows[currentIndex];
        const [l1, l2] = getSelectedLangCodes();
        const slotToLang = { 1: l1, 2: l2 };
        const k = slotToLang[pos];
        const text = row[k] || '';
        const vmap = getVoicesMap();
        const voices = speechSynthesis.getVoices();
        const v = findVoiceForLang(voices, vmap[k], k);
        const u = new SpeechSynthesisUtterance(text);
        if (v) u.voice = v;
        u.lang = (v && v.lang) ? v.lang : (langMeta[k]?.localeGuess?.[0] || 'en-US');
        const { rate, pitch } = getRatePitch();
        u.rate = rate; u.pitch = pitch;
        speechSynthesis.speak(u);
      }

      // --- Selection & Display ---
      function ensureParsed() {
        parsedRows = parseCSV(els.csvBox.value);

        setPhraseTexts(row);
        applyShowVisibility();
        const sessionToken = ++phraseSessionId;
        if (speak) {
          return speakCurrentRowSequence(sessionToken, row);
        }
        return Promise.resolve();
      }

      // --- Speaking Practice Flow ---
      function createRecognition(lang) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return null;
        const rec = new SR();
        rec.lang = pickRecLang(lang);
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        return rec;
      }

      function pickRecLang(k) {
        // Use first locale guess for recognition; browsers may map internally
        return langMeta[k].localeGuess[0] || 'en-US';
      }

      async function startSpeakingPractice() {
        if (speakingPractice.active) return;
        speakingPractice.active = true;
        speakingPractice.lang = (els.modeContent.querySelector('#sp-lang')?.value) || speakingPractice.lang || 'es';
        speakingPractice.min = parseInt(els.modeContent.querySelector('#sp-min')?.value || '90', 10) || 90;
        speakingPractice.statusEl.textContent = 'Starting…';

        // persist chosen speaking language
        saveConfig();

        // User gesture initiates: select phrase and speak sequence, then start mic
        await selectAndShowRandomRow({ speak: true });
        if (!speakingPractice.active) return;

        const target = (parsedRows[currentIndex] || {})[speakingPractice.lang] || '';
        const myToken = phraseSessionId;

        if (speakingPractice.rec) {
          try { speakingPractice.rec.abort(); } catch { }
          speakingPractice.rec = null;
        }
        const rec = createRecognition(speakingPractice.lang);
        speakingPractice.rec = rec;

        if (!rec) {
          speakingPractice.statusEl.textContent = 'Speech recognition not supported in this browser.';
          speakingPractice.active = false;
          return;
        }

        speakingPractice.liveTextEl.textContent = '';
        speakingPractice.progressEl.value = 0;
        speakingPractice.scoreEl.textContent = '0%';
        speakingPractice.statusEl.textContent = 'Listening…';

        rec.onresult = (e) => {
          if (!speakingPractice.active) return;
          if (myToken !== phraseSessionId) return;
          let interim = '';
          let finalText = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            if (res.isFinal) finalText += res[0].transcript;
            else interim += res[0].transcript;
          }
          const live = (finalText || interim || '').trim();
          speakingPractice.liveTextEl.textContent = live;

          const pct = similarityPercent(live, target);
          speakingPractice.progressEl.value = pct;
          speakingPractice.scoreEl.textContent = pct + '%';

          if (pct >= speakingPractice.min && finalText) {
            speakingPractice.statusEl.textContent = 'Great! ✅';
            try { rec.abort(); } catch { }
            // Prepare next phrase safely
            safeAdvanceSpeakingPractice(myToken);
          }
        };
        rec.onerror = () => {
          if (!speakingPractice.active) return;
          if (myToken !== phraseSessionId) return;
          // Keep listening; status note
          speakingPractice.statusEl.textContent = 'Listening…';
        };
        rec.onend = () => {
          // If ended unexpectedly while active and token still valid, attempt to restart
          if (speakingPractice.active && myToken === phraseSessionId) {
            try { rec.start(); } catch { }
          }
        };

        try { rec.start(); } catch { }
      }

      async function safeAdvanceSpeakingPractice(prevToken) {
        // Cancel all previous activities, increment session, then proceed
        try { speechSynthesis.cancel(); } catch { }
        if (speakingPractice.rec) {
          try { speakingPractice.rec.abort(); } catch { }
          speakingPractice.rec = null;
        }
        const newToken = ++phraseSessionId;
        if (!speakingPractice.active) return;
        // Move to next phrase: select + speak once, await speak, then listen again
        await selectAndShowRandomRow({ speak: true });
        if (!speakingPractice.active) return;
        // Restart recognition for the new target
        await startSpeakingPracticeCycleOnly();
      }

      async function startSpeakingPracticeCycleOnly() {
        // Start listening for current phrase without triggering TTS again
        const target = (parsedRows[currentIndex] || {})[speakingPractice.lang] || '';
        const myToken = phraseSessionId;

        if (speakingPractice.rec) {
          try { speakingPractice.rec.abort(); } catch { }
          speakingPractice.rec = null;
        }
        const rec = createRecognition(speakingPractice.lang);
        speakingPractice.rec = rec;
        if (!rec) {
          speakingPractice.statusEl.textContent = 'Speech recognition not supported in this browser.';
          speakingPractice.active = false;
          return;
        }

        speakingPractice.liveTextEl.textContent = '';
        speakingPractice.progressEl.value = 0;
        speakingPractice.scoreEl.textContent = '0%';
        speakingPractice.statusEl.textContent = 'Listening…';

        rec.onresult = (e) => {
          if (!speakingPractice.active) return;
          if (myToken !== phraseSessionId) return;
          let interim = '';
          let finalText = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            if (res.isFinal) finalText += res[0].transcript;
            else interim += res[0].transcript;
          }
          const live = (finalText || interim || '').trim();
          speakingPractice.liveTextEl.textContent = live;

          const pct = similarityPercent(live, target);
          speakingPractice.progressEl.value = pct;
          speakingPractice.scoreEl.textContent = pct + '%';

          if (pct >= speakingPractice.min && finalText) {
            speakingPractice.statusEl.textContent = 'Great! ✅';
            try { rec.abort(); } catch { }
            safeAdvanceSpeakingPractice(myToken);
          }
        };
        rec.onerror = () => {
          if (!speakingPractice.active) return;
          if (myToken !== phraseSessionId) return;
          speakingPractice.statusEl.textContent = 'Listening…';
        };
        rec.onend = () => {
          if (speakingPractice.active && myToken === phraseSessionId) {
            try { rec.start(); } catch { }
          }
        };
        try { rec.start(); } catch { }
      }

      function stopSpeakingPractice() {
        speakingPractice.active = false;
        if (speakingPractice.rec) {
          try { speakingPractice.rec.abort(); } catch { }
          speakingPractice.rec = null;
        }
        try { speechSynthesis.cancel(); } catch { }
        if (speakingPractice.statusEl) speakingPractice.statusEl.textContent = 'Stopped';
      }

      // --- Writing Practice Flow ---
      async function startWritingPractice() {
        if (writingPractice.active) return;
        writingPractice.active = true;
        writingPractice.statusEl.textContent = 'Starting…';
        writingPractice.lang = (els.modeContent.querySelector('#wr-lang')?.value) || writingPractice.lang || 'es';
        // persist chosen writing language
        saveConfig();

        // Select and speak once
        await selectAndShowRandomRow({ speak: true });
        updateCurrentWriteTarget();
        writingPractice.statusEl.textContent = 'Type what you hear…';

        // Attach oninput handler referencing mutable target
        const input = writingPractice.inputEl;
        input.value = '';
        input.disabled = false;

        const onInput = async (e) => {
          if (!writingPractice.active || writingPractice.writingBusy) return;
          const user = normalizeForCompare(e.target.value);
          const target = normalizeForCompare(writingPractice.currentWriteTarget);
          if (user && user === target) {
            writingPractice.writingBusy = true;
            // Advance to next phrase safely; ensure single playback
            try { speechSynthesis.cancel(); } catch { }
            await selectAndShowRandomRow({ speak: true });
            updateCurrentWriteTarget();
            e.target.value = '';
            writingPractice.writingBusy = false;
          }
        };
        // Store handler so we can disable/enable without stale closure
        input.oninput = onInput;
      }

      function stopWritingPractice() {
        writingPractice.active = false;
        if (writingPractice.inputEl) {
          writingPractice.inputEl.oninput = null;
          writingPractice.inputEl.disabled = true;
        }
        try { speechSynthesis.cancel(); } catch { }
        if (writingPractice.statusEl) writingPractice.statusEl.textContent = 'Stopped';
      }

      function updateCurrentWriteTarget() {
        const row = parsedRows[currentIndex] || {};
        const k = writingPractice.lang;
        writingPractice.currentWriteTarget = row[k] || '';
      }

      // --- Voices population ---
      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        const [l1, l2] = getSelectedLangCodes();
        const slots = [{ pos: 1, code: l1 }, { pos: 2, code: l2 }];
        for (const s of slots) {
          const sel = els.voices[s.pos];
          const prev = sel.value;
          sel.innerHTML = '';
          const k = s.code;
          const guessList = (langMeta[k] && Array.isArray(langMeta[k].localeGuess)) ? langMeta[k].localeGuess : [k];
          let matching = voices.filter(v => v.lang && guessList.some(gl => v.lang.startsWith(gl)));
          if (matching.length === 0) matching = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(k));

          if (matching.length > 0) {
            for (const v of matching) {
              const opt = document.createElement('option');
              opt.value = v.name;
              opt.textContent = `${v.name} (${v.lang || '??'})`;
              sel.appendChild(opt);
            }
            const guess = matching.find(v => langMeta[k] && langMeta[k].localeGuess && langMeta[k].localeGuess.some(gl => v.lang && v.lang.startsWith(gl)));
            if (guess) sel.value = guess.name;
            if (!sel.value && sel.options.length) sel.selectedIndex = 0;
            if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
            if (savedConfig && savedConfig.voices && savedConfig.voices[k]) {
              const want = savedConfig.voices[k];
              if ([...sel.options].some(o => o.value === want)) sel.value = want;
            }
          } else {
            const opt = document.createElement('option');
            opt.value = '';
            opt.disabled = true;
            opt.selected = true;
            opt.textContent = '(no matching voices available)';
            sel.appendChild(opt);
          }
        }
      }

      // --- Predefined sets discovery & loading ---
      async function populatePredefinedList() {
        const sel = els.predefinedSelect;
        sel.innerHTML = ''; // Limpiar opciones previas

        try {
          // Intento local
          const res = await fetch('./predefined_phrases/');
          const text = await res.text();
          const tmp = document.createElement('div');
          tmp.innerHTML = text;
          const links = [...tmp.querySelectorAll('a[href$=".csv"], a[href$=".txt"]')];
          const names = links.map(a => (a.textContent || '').trim()).filter(Boolean);
          if (names.length === 0) throw new Error('No se encontraron archivos válidos en el servidor local.');
          for (const n of names) {
            const opt = document.createElement('option');
            opt.value = n;
            opt.textContent = n;
            sel.appendChild(opt);
          }
        } catch (error) {
          console.warn('Fallo la carga local:', error.message || error.toString());
          await fallbackToGithub();
        }

        async function fallbackToGithub() {
          try {
            const user = "haiver77";       // ejemplo: "johnmalagon"
            const repo = "language_learning";   // ejemplo: "mi-web"
            const branch = "main";           // o "master" según tu repo
            const path = "predefined_phrases";

            const githubApiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=${branch}`;
            const res = await fetch(githubApiUrl);
            const files = await res.json();
            if (!Array.isArray(files)) throw new Error('Respuesta inesperada de GitHub');

            const validFiles = files
              .filter(f => f.name.endsWith('.csv') || f.name.endsWith('.txt'))
              .map(f => f.name);

            if (validFiles.length === 0) throw new Error('No se encontraron archivos válidos en GitHub.');

            for (const name of validFiles) {
              const opt = document.createElement('option');
              opt.value = name;
              opt.textContent = name;
              sel.appendChild(opt);
            }
          } catch (err) {
            alert('No se pudo cargar la lista de frases desde GitHub: ' + (err.message || err.toString()));
          }
        }
      }


      async function loadSelectedPredefined() {
        const name = els.predefinedSelect.value;
        if (!name) return;
        try {
          const res = await fetch(`./predefined_phrases/${encodeURIComponent(name)}`);
          const text = await res.text();
          els.csvBox.value = text.trim();
          ensureParsed();
          if (parsedRows.length) {
            await selectAndShowRandomRow({ speak: false });
          }
        } catch {
          // ignore
        }
      }

      // --- Prompt - OpenAI integration ---
      function buildAIPrompt(level, topic, quantity, minWords) {
        const q = Number.isFinite(Number(quantity)) ? Number(quantity) : 40;
        const m = Number.isFinite(Number(minWords)) ? Number(minWords) : 15;
        const [l1, l2] = getSelectedLangCodes();
        const label1 = (langMeta[l1] && langMeta[l1].label) || l1;
        const label2 = (langMeta[l2] && langMeta[l2].label) || l2;
        return `Generate a plain text list of ${q} lines about "${topic}". Each line must contain two phrases separated by a semicolon (";") in this exact order: ${label1}; ${label2}.
  Requirements:
   - Each phrase must contain at least ${m} words.
   - Vocabulary and grammar must match CEFR level "${level}".
   - Do not include numbering, bullet points, blank lines, or any extra text before or after the list.
       - Before returning the response, confirm that each line follows the exact language order: ${label1}; ${label2}.
   - Output only the list (no commentary, no labels, no metadata).

  Quick example of required line format
      - "Example in ${label1} with five words; Example in ${label2} with five words"`;
      }

      async function callOpenAI(token, prompt) {
        const url = 'https://api.openai.com/v1/chat/completions';
        const body = {
          model: 'gpt-3.5-turbo',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.7,
          max_tokens: 2000,
        };
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || `OpenAI error ${res.status}`);
        }
        const j = await res.json();
        return (j.choices && j.choices[0] && (j.choices[0].message?.content || j.choices[0].text)) || '';
      }

      async function loadFromAI() {
        const token = (els.openaiToken.value || '').trim();
        const level = (els.aiLevel.value || 'A1');
        const topic = (els.aiTopic.value || '').trim() || 'general';
        const quantity = parseInt(els.aiQuantity.value || '40', 10) || 40;
        const minWords = parseInt(els.aiMinWords?.value || '15', 10) || 15;
        if (!token) { alert('Please enter your OpenAI token in OPEN_AI_TOKEN.'); return; }
        els.btnLoadAI.disabled = true;
        els.aiStatus.textContent = 'Loading…';
        try {
          // persist token locally for convenience
          try { localStorage.setItem('openai_token', token); } catch { }
          const prompt = buildAIPrompt(level, topic, quantity, minWords);
          const content = await callOpenAI(token, prompt);
          // Put response into csvBox
          els.csvBox.value = (content || '').trim();
          ensureParsed();
          // Show first item silently so UI updates
          if (parsedRows.length) await selectAndShowRandomRow({ speak: false });
          els.aiStatus.textContent = 'Loaded';
        } catch (err) {
          console.error('OpenAI load error', err);
          alert('OpenAI error: ' + (err.message || err));
          els.aiStatus.textContent = 'Error';
        } finally {
          els.btnLoadAI.disabled = false;
        }
      }

      // --- Event wiring ---
      function bindEvents() {
        // Random button (global)
        els.btnRandom.onclick = async () => { await selectAndShowRandomRow({ speak: true }); };

        // Mode switching
        els.modeSelect.onchange = () => {
          // Stop timers/practices on switch
          if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
          stopSpeakingPractice();
          stopWritingPractice();
          renderModePanel();
          saveConfig();
        };

        // Replay per language
        // Replay per slot
        els.replay[1].onclick = () => replaySlot(1);
        els.replay[2].onclick = () => replaySlot(2);

        // Show/Hide slots
        els.show[1].onchange = () => { applyShowVisibility(); saveConfig(); };
        els.show[2].onchange = () => { applyShowVisibility(); saveConfig(); };

        // Read slot checkboxes
        els.read[1].onchange = () => { saveConfig(); };
        els.read[2].onchange = () => { saveConfig(); };

        // Font size
        const applyFont = () => {
          const px = Math.max(14, Math.min(100, parseInt(els.fontRange.value || '26', 10)));
          document.documentElement.style.setProperty('--phrase-font', px + 'px');
          els.fontValue.textContent = px + ' px';
        };
        els.fontRange.oninput = () => { applyFont(); saveConfig(); };

        // Theme toggle
        els.themeToggle.onchange = () => {
          const isDark = els.themeToggle.checked;
          document.body.classList.toggle('theme-light', !isDark);
          document.body.classList.toggle('theme-dark', isDark);
          saveConfig();
        };

        // CSV changes
        els.csvBox.oninput = () => { ensureParsed(); saveConfig(); };

        // Predefined
        els.btnLoadPredefined.onclick = async () => { await loadSelectedPredefined(); saveConfig(); };
        els.predefinedSelect.onchange = () => saveConfig();

        // File input
        els.fileInput.onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const text = await file.text();
          els.csvBox.value = text.trim();
          ensureParsed();
          await selectAndShowRandomRow({ speak: false });
          saveConfig();
        };

        // Voices ready
        els.voices[1].onchange = () => saveConfig();
        els.voices[2].onchange = () => saveConfig();
        // Language selectors: update labels and voices when changed
        els.lang1Select.onchange = () => { updateLangLabels(); populateVoices(); ensureParsed(); selectAndShowRandomRow({ speak: false }); saveConfig(); };
        els.lang2Select.onchange = () => { updateLangLabels(); populateVoices(); ensureParsed(); selectAndShowRandomRow({ speak: false }); saveConfig(); };
        if ('onvoiceschanged' in speechSynthesis) {
          speechSynthesis.onvoiceschanged = () => populateVoices();
        }
        // Rate / Pitch
        els.rate.onchange = () => saveConfig();
        els.pitch.onchange = () => saveConfig();
        // AI button
        els.btnLoadAI.onclick = loadFromAI;
        els.aiLevel.onchange = () => saveConfig();
        els.aiTopic.oninput = () => saveConfig();
        els.aiQuantity.onchange = () => saveConfig();
        if (els.aiMinWords) els.aiMinWords.onchange = () => saveConfig();
      }

      // --- Init sample data ---
      function loadSamplePhrases() {
        const sample = [
          'Hola;Hello',
          'Buenos días;Good morning',
          '¿Cómo estás?;How are you?',
          'Gracias;Thank you',
          'Por favor;Please',
          'Lo siento;Sorry',
          '¿Dónde está el baño?;Where is the bathroom?',
          'Me gusta aprender idiomas;I like learning languages',
          '¿Cuánto cuesta?;How much is it?',
          'Hasta luego;See you later'
        ].join('\n');
        els.csvBox.value = sample;
        ensureParsed();
      }

      // --- Bootstrap ---
      function init() {
        // Load saved UI configuration first (if any)
        loadConfig();

        // Only load sample phrases when there's no saved CSV content
        if (!savedConfig || !savedConfig.csv) loadSamplePhrases();

        renderModePanel();
        bindEvents();
        // ensure language labels are in-sync before populating voices
        updateLangLabels();
        applyShowVisibility();
        populateVoices();
        populatePredefinedList();

        // Initial phrase display (silent) so UI isn't empty
        selectAndShowRandomRow({ speak: false });

        // Defaults only when no saved configuration
        if (!savedConfig) {
          els.themeToggle.checked = true;
          els.fontRange.value = 26;
          els.fontValue.textContent = '26 px';
        }
        // restore saved OpenAI token if any
        try { const t = localStorage.getItem('openai_token'); if (t) els.openaiToken.value = t; } catch { }
      }

      // Expose minimal for debugging (optional)
      window._trainer = { state: () => ({ currentIndex, phraseSessionId, parsedRowsCount: parsedRows.length }) };

      init();
    })();
  </script>
